name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # ลงแค่ pytest: parser/metrics ใช้ stdlib ล้วน ไม่ต้องลง OCR หนัก ๆ ใน CI
      - run: pip install pytest
      - run: pytest -q
